# Déclencheur des notifications push : appelle l'endpoint qui envoie les
# notifications arrivées à échéance (voir push.py). Les crons GitHub tournent
# au mieux toutes les ~5 min et peuvent être retardés : les notifications
# arrivent donc par petites rafales, comme une pile sur l'écran de verrouillage.
name: push-dispatch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Envoyer les notifications dues
        run: curl -fsS --retry 2 --max-time 30 "https://viral-vi-drab.vercel.app/api/push/dispatch"
